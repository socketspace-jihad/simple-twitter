image: golang:1.24

pipelines:
  default:
    - parallel:
      - step:
          name: Test and Build
          script:
            - mkdir test-reports
            - go install github.com/jstemmer/go-junit-report/v2@latest
            - go test ./... -v 2>&1 | $(go env GOPATH)/bin/go-junit-report > test-reports/report.xml
            - go build
      - step:
          name: Lint code
          image: golangci/golangci-lint:v1.31.0
          script:
            - golangci-lint run -v

